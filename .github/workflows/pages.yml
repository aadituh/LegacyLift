name: Publish LegacyLift to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/web/**', 'docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Build the web app as static files for /LegacyLift/
        working-directory: frontend/web
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://legacylift-api.onrender.com' }}
          NEXT_PUBLIC_NEON_AUTH_URL: ${{ vars.NEXT_PUBLIC_NEON_AUTH_URL || vars.VITE_NEON_AUTH_URL }}
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Include course website at /course/
        run: |
          mkdir -p frontend/web/out/course
          cp -R docs/. frontend/web/out/course/
          touch frontend/web/out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/web/out

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
