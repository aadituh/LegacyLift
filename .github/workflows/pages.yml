name: Publish LegacyLift to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/app/package-lock.json

      - name: Install and check frontend
        working-directory: frontend/app
        run: |
          npm ci
          npm run lint

      - name: Build frontend for repository Pages path
        working-directory: frontend/app
        env:
          GITHUB_PAGES: 'true'
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://legacylift-api.onrender.com' }}
        run: npm run build

      - name: Include course website at /course/
        run: |
          mkdir -p frontend/app/dist/course
          cp -R docs/. frontend/app/dist/course/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages files
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/app/dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
