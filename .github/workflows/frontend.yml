name: Frontend checks
on:
  push:
    branches: [main]
    paths: ['frontend/web/**', 'backend/**', '.github/workflows/frontend.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Install backend for integration tests
        working-directory: backend
        run: uv sync --frozen
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Unit tests
        run: npm run test:run
      - name: Build production app
        env:
          API_URL: http://127.0.0.1:8011
          NEXT_PUBLIC_NEON_AUTH_URL: ''
        run: npm run build
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
      - name: Browser integration and accessibility tests
        run: npm run e2e
      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-report
          path: |
            frontend/web/playwright-report
            frontend/web/test-results
          retention-days: 14
