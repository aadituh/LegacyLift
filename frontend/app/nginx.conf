server {
    listen 80;
    root /usr/share/nginx/html;

    # Same limit the API enforces (1.2 MB), with room for form overhead.
    client_max_body_size 2m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
    }

    location = /health {
        proxy_pass http://api:8000;
    }
}
