<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Legacy Lift Prototype</title>
  <style>
    body { font-family: Georgia, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    button, input { margin: 0.35rem 0.35rem 0.35rem 0; padding: 0.5rem 0.75rem; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; white-space: pre-wrap; }
    #status.error { color: #b00020; font-weight: 600; }
    .tabs { margin-top: 0.75rem; }
    .tabs button.active { font-weight: 700; text-decoration: underline; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .split.single { grid-template-columns: 1fr; }
    .split h3 { margin: 0 0 0.5rem; font-size: 1rem; }
    .split[hidden], #out[hidden], #console[hidden], #compare[hidden],
    #cobol-pane[hidden], #python-pane[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Legacy Lift Prototype</h1>
  <p>Upload COBOL, view analysis, then convert to functionally equivalent Python (notebook pipeline).</p>
  <input id="file" type="file" accept=".cbl,.cob">
  <button type="button" id="sample">Load Sample</button>
  <button type="button" id="analyze">View Analysis</button>
  <button type="button" id="convert">Start Translation</button>
  <button type="button" id="download">Download Python</button>
  <p id="status">No file loaded yet.</p>
  <div class="tabs">
    <button type="button" id="tab-out" class="active">Results</button>
    <button type="button" id="tab-compare">Translation Comparison</button>
    <button type="button" id="tab-console">Console Log</button>
  </div>
  <h2 id="panel-title">Results</h2>
<pre id="out">Waiting…</pre>
<div id="compare" hidden>
  <div class="tabs">
    <button type="button" id="view-split" class="active">Split View</button>
    <button type="button" id="view-cobol">COBOL Only</button>
    <button type="button" id="view-python">Python Only</button>
  </div>
<div id="split" class="split">
  <div id="cobol-pane">
    <h3>Original COBOL</h3>
    <pre id="cobol">Waiting…</pre>
  </div>
  <div id="python-pane">
    <h3>Generated Python</h3>
    <pre id="python">Waiting…</pre>
  </div>
</div>
</div>
<pre id="console" hidden>No conversion log yet.</pre>
  <script>
    /*
    Conversion UI (frontend/index.html), served by FastAPI at http://127.0.0.1:800
    Buttons
      Load Sample / file picker - COBOL into the file input
      View Analysis - POST /api/analyze, Results tab (program, fields, paragraphs)
      Start Translation - POST /api/convert, then Translation Comparison
      Download Python - saves lastPython as a .py file

    Tabs
      Results - analysis (or sample COBOL before convert)
      Translation Comparison - last COBOL vs generated Python
        Split view / COBOL only / Python Only
      Cobsole Log - last analyze/convert log from the API

    Same-source skip (this browser tab only, currently no history feature)
      lastCobol / lastPython / lastTranslatedKey remember the last convert
      Same COBOL text again = do not call /api/convert; tell user to open Translation Comparison
      Different COBOL text = clearTranslation(), then convert again
      Since there is currently no history feature A to B to A still converts

    API_ORIGIN is "" when this page is on port 8000; otherwise it calls 127.0.0.1:800
    */
    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");
    const consoleEl = document.getElementById("console");
    const titleEl = document.getElementById("panel-title");
    const fileEl = document.getElementById("file");
    const cobolEl = document.getElementById("cobol");
    const pythonEl = document.getElementById("python");
    const splitEl = document.getElementById("split");
    const compareEl = document.getElementById("compare");
    const cobolPane = document.getElementById("cobol-pane");
    const pythonPane = document.getElementById("python-pane");
    const COBOL_ERROR = "That is not a COBOL file. Choose a .cbl or .cob file.";
    let lastConsole = "No conversion log yet.";
    let lastPython = "";
    let lastCobol = "";
    let lastTranslatedKey = "";
    function currentFile() {
      return fileEl.files[0];
    }
    function isCobolFile(file) {
      return /\.(cbl|cob)$/i.test(file.name);
    }
    // Name + source text. Start Translation uses this to detect already converted.
    function fileKey(file, source) {
      return (file && file.name ? file.name : "") + ":" + (source || "");
    }
    // Clears the saved Python so next conversion is new, it does not clear lastCOBOL.
    function clearTranslation() {
      lastPython = "";
      lastTranslatedKey = "";
    }
    // Turns /api/analyze JSON into readable program / fields / paragraphs text.
    function formatAnalysis(data) {
      const fields = (data.attributes || [])
      .map((item) => "- " + item.name + " (" + item.pic + ")")
      .join("\n") || "- none";
      const paragraphs = (data.paragraphs || [])
      .map((item) => "- " + item.name)
      .join("\n") || "- none";
      return (
      "Program: " + (data.program_name || "UNKNOWN") + "\n\n" +
      "Fields:\n" + fields + "\n\n" +
      "Paragraphs:\n" + paragraphs
    );
    }
    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", Boolean(isError));
    }
    const API_ORIGIN = location.port === "8000" ? "" : "http://127.0.0.1:8000";
    function showError(err) {
      setStatus(err.message, true);
      outEl.textContent = err.message;
    }
    function setTab(activeId) {
      document.getElementById("tab-out").classList.toggle("active", activeId === "tab-out");
      document.getElementById("tab-compare").classList.toggle("active", activeId === "tab-compare");
      document.getElementById("tab-console").classList.toggle("active", activeId === "tab-console");
    }
    function setCompareMode(mode) {
      document.getElementById("view-split").classList.toggle("active", mode === "split");
      document.getElementById("view-cobol").classList.toggle("active", mode === "cobol");
      document.getElementById("view-python").classList.toggle("active", mode === "python");
      cobolPane.hidden = mode === "python";
      pythonPane.hidden = mode === "cobol";
      splitEl.classList.toggle("single", mode != "split");
    }
    function showResults() {
      outEl.hidden = false;
      compareEl.hidden = true;
      consoleEl.hidden = true;
      titleEl.textContent = "Results";
      setTab("tab-out");
    }
    // Needs lastPython. #compare is the panel #split is not hidden or view is blank
    function showCompare() {
      if (!lastPython) {
        setStatus("Translate a file first.", true);
        return;
      }
      outEl.hidden = true;
      compareEl.hidden = false;
      splitEl.hidden = false;
      consoleEl.hidden = true;
      titleEl.textContent = "Translation Comparison";
      setTab("tab-compare");
    }
    function showConsole() {
      outEl.hidden = true;
      compareEl.hidden = true;
      consoleEl.hidden = false;
      consoleEl.textContent = lastConsole;
      titleEl.textContent = "Console Log";
      setTab("tab-console");
    }
    async function api(url, options) {
      const response = await fetch(API_ORIGIN + url, { cache: "no-store", ...options });
      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (err) {
        const snippet = text.replace(/\s+/g, " ").trim().slice(0, 180);
        throw new Error(snippet
          ? "The server did not return JSON. " + snippet
          : "The server returned an empty response.");
      }
      if (!response.ok) {
        const detail = data && data.detail;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(data));
      }
      return data;
    }
    document.getElementById("tab-out").onclick = showResults;
    document.getElementById("tab-compare").onclick = showCompare;
    document.getElementById("tab-console").onclick = showConsole;
    document.getElementById("view-split").onclick = () => setCompareMode("split");
    document.getElementById("view-cobol").onclick = () => setCompareMode("cobol"); 
    document.getElementById("view-python").onclick = () => setCompareMode("python"); 
    document.getElementById("sample").onclick = async () => {
      try {
        const sample = await api("/api/sample");
        const blob = new Blob([sample.source], { type: "text/plain" });
        const file = new File([blob], sample.name);
        const dt = new DataTransfer();
        dt.items.add(file);
        fileEl.files = dt.files;
        // Exact same sample text as last convert: keep Python, do not clear.
        if (lastPython && lastCobol === sample.source) {
          setStatus("This file is already translated. View Translation Comparison.");
          return
        }
        lastCobol = sample.source;
        clearTranslation();
        setStatus("Sample loaded. Click View Analysis or Start Translation.");
        outEl.textContent = sample.source;
        showResults();
      } catch (err) {
        showError(err);
      }
    };
    fileEl.onchange = () => {
      const file = currentFile();
      if (!file) return;
      if (!isCobolFile(file)) {
        setStatus(COBOL_ERROR, true);
        return;
      }
      file.text().then((text) => {
        // Exact same COBOL text as last convert: keep Python, do not clear.
        if (lastPython && text === lastCobol) {
          setStatus("This file is already translated. View Translation Comparison.");
          return;
        }
        lastCobol = text;
        clearTranslation();
        setStatus(file.name + " loaded. Click View Analysis or Start Translation.");
      });
    }
    document.getElementById("analyze").onclick = async () => {
      const file = currentFile();
      if (!file) { setStatus("Choose a file first.", true); return; }
      if (!isCobolFile(file)) { setStatus(COBOL_ERROR, true); return; }
      const body = new FormData();
      body.append("file", file);
      try {
        const data = await api("/api/analyze", { method: "POST", body });
        lastView = "analysis";
        setStatus("Analysis done.");
        lastConsole = "Analysis complete for " + (data.filename || file.name);
        outEl.textContent = formatAnalysis(data);
        showResults();
      } catch (err) {
        showError(err);
      }
    };
    document.getElementById("convert").onclick = async () => {
      const file = currentFile();
      if (!file) { setStatus("Choose a file first.", true); return; }
      if (!isCobolFile(file)) { setStatus(COBOL_ERROR, true); return; }
      if (!lastCobol) lastCobol = await file.text();
      const key = fileKey(file, lastCobol);
      // Same filename + source as last successful convert: skip /api/convert.
      if (lastPython && lastTranslatedKey === key) {
        setStatus("This file is already translated. View Translation Comparison.");
        showCompare();
        return;
      }
      const body = new FormData();
      body.append("file", file);
      try {
        setStatus("Converting...");
        const data = await api("/api/convert", { method: "POST", body });
        lastPython = data.python || "";
        lastTranslatedKey = key;
        setStatus("Translation done. Use Translation Comparison to view.");
        lastConsole = data.console_log || JSON.stringify(data, null, 2);
        cobolEl.textContent = lastCobol || "(no COBOL loaded)";
        pythonEl.textContent = lastPython || JSON.stringify(data, null, 2);
        consoleEl.textContent = lastConsole;
        setCompareMode("split");
        showCompare();
      } catch (err) {
        showError(err);
      }
    };
    document.getElementById("download").onclick = () => {
      if (!lastPython) {
        setStatus("Convert a file first.", true);
        return;
    }
    const name = ((currentFile() && currentFile().name) || "converted.cbl")
    .replace(/\.(cbl|cob)$/i, "") + ".py";
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([lastPython], { type: "text/plain" }));
    link.download = name;
    link.click();
    URL.revokeObjectURL(link.href);
    setStatus("Downloaded " + name + ".");
  };
  </script>
</body>
</html>
