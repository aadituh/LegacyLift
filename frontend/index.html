<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Legacy Lift Prototype</title>
  <style>
    body { font-family: Georgia, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    button, input { margin: 0.35rem 0.35rem 0.35rem 0; padding: 0.5rem 0.75rem; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; white-space: pre-wrap; }
    #status.error { color: #b00020; font-weight: 600; }
    .tabs { margin-top: 0.75rem; }
    .tabs button.active { font-weight: 700; text-decoration: underline; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .split.single { grid-template-columns: 1fr; }
    .split h3 { margin: 0 0 0.5rem; font-size: 1rem; }
    .split[hidden], #out[hidden], #console[hidden], #compare[hidden],
    #cobol-pane[hidden], #python-pane[hidden], #history[hidden] { display: none; }
    #history-list { list-style: none; padding: 0; margin: 0.5rem 0; }
    #history-list button { display: block; width: 100%; text-align: left; }
  </style>
</head>
<body>
  <h1>Legacy Lift Prototype</h1>
  <p>Upload COBOL, then convert to view Analysis and Translation (to equivalently functional Python).</p>
  <input id="file" type="file" accept=".cbl,.cob">
  <button type="button" id="sample">Load Sample</button>
  <button type="button" id="convert">Start</button>
  <button type="button" id="download">Download Python</button>
  <p id="status">No file loaded yet.</p>
  <div class="tabs">
    <button type="button" id="tab-out" class="active">Analysis</button>
    <button type="button" id="tab-compare">Translation</button>
    <button type="button" id="tab-console">Console Log</button>
    <button type="button" id="tab-history">History</button>
  </div>
  <h2 id="panel-title">Analysis</h2>
<pre id="out">Waiting…</pre>
<div id="compare" hidden>
  <div class="tabs">
    <button type="button" id="view-split" class="active">Split View</button>
    <button type="button" id="view-cobol">COBOL Only</button>
    <button type="button" id="view-python">Python Only</button>
  </div>
<div id="split" class="split">
  <div id="cobol-pane">
    <h3>Original COBOL</h3>
    <pre id="cobol">Waiting…</pre>
  </div>
  <div id="python-pane">
    <h3>Generated Python</h3>
    <pre id="python">Waiting…</pre>
  </div>
</div>
</div>
<pre id="console" hidden>No conversion log yet.</pre>
<div id="history" hidden>
  <p>Past conversions. Click on selected file to reopen it.</p>
  <ul id="history-list"></ul>
  <button type="button" id="clear-history">Clear History</button>
</div>
  <script>
    /*
    Conversion UI (frontend/index.html), served by FastAPI at http://127.0.0.1:8000
    Buttons
      Load Sample / file picker - COBOL into the file input
      Start - POST /api/convert, then POST /api/analyze; fills Analysis + Translation
      Download Python - saves lastPython as a .py file

    Tabs
      Analysis - program, fields, paragraphs (Waiting... until Start is clicked)
      Translation - last COBOL vs generated Python
        Split view / COBOL only / Python Only
      Console Log - last analyze/convert log from the API
      History - past conversions in browser (localStorage)

    Same-source skip (this browser tab only)
      lastCobol / lastPython / lastTranslatedKey remember the last convert
      Skip conversion if the COBOL text already has a history row
      History list/replace is by filename (same name overwrites that row)
      Clear History re-saves the translation still on screen

    API_ORIGIN is "" when this page is on port 8000; otherwise it calls 127.0.0.1:8000
    */
    const statusEl = document.getElementById("status");
    const outEl = document.getElementById("out");
    const consoleEl = document.getElementById("console");
    const titleEl = document.getElementById("panel-title");
    const fileEl = document.getElementById("file");
    const cobolEl = document.getElementById("cobol");
    const pythonEl = document.getElementById("python");
    const splitEl = document.getElementById("split");
    const compareEl = document.getElementById("compare");
    const cobolPane = document.getElementById("cobol-pane");
    const pythonPane = document.getElementById("python-pane");
    const COBOL_ERROR = "That is not a COBOL file. Choose a .cbl or .cob file.";
    let lastConsole = "No conversion log yet.";
    let lastAnalysis = "";
    let lastPython = "";
    let lastCobol = "";
    let lastTranslatedKey = "";
    const historyEl = document.getElementById("history");
    const historyListEl= document.getElementById("history-list");
    const HISTORY_KEY = "legacylift-history";
    function currentFile() {
      return fileEl.files[0];
    }
    function isCobolFile(file) {
      return /\.(cbl|cob)$/i.test(file.name);
    }
    // Name + source text. Start uses this to detect already converted file.
    function fileKey(file, source) {
      return (file && file.name ? file.name : "") + ":" + (source || "");
    }
    // Drops Python, analysis, and skip-key. Keep lastCobol so a new Start can run.
    function clearTranslation() {
      lastAnalysis = "";
      lastPython = "";
      lastTranslatedKey = "";
    }
    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
      } catch (err) {
        return [];
      }
    }
    // One row per filename: same name replaces the old row. Newest first, with a cap of 20.
    function saveHistoryEntry(name, cobol, python, consoleLog, analysis) {
      const items = loadHistory().filter((item) => item.name !== name);
      items.unshift({
        name: name || "upload.cbl",
        cobol: cobol,
        python: python,
        consoleLog: consoleLog || "",
        analysis: analysis || "",
        time: new Date().toLocaleString()
      });
      localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, 20)));
      renderHistory();
    }
    // Same filename + text already in history: reopen it and do not convert again.
    function findHistory(fileName, cobol) {
      return loadHistory().find((item) => item.name === fileName && item.cobol === cobol);
    }
    // Same COBOL text, any filename (reuse translation, save under the new name).
    function findHistoryByText(cobol) {
      return loadHistory().find((item) => item.cobol === cobol);
    }
    // Puts that history row back into the file input, Analysis, and Translation.
    function restoreHistory(item) {
      lastCobol = item.cobol;
      lastPython = item.python;
      lastConsole = item.consoleLog || lastConsole;
      lastTranslatedKey = fileKey({ name: item.name }, item.cobol);
      const blob = new Blob([item.cobol], { type: "text/plain" });
      const file = new File([blob], item.name);
      const dt = new DataTransfer();
      dt.items.add(file);
      fileEl.files = dt.files;
      cobolEl.textContent = item.cobol;
      pythonEl.textContent = item.python;
      lastAnalysis = item.analysis || "";
      outEl.textContent = lastAnalysis || "Waiting...";
      consoleEl.textContent = lastConsole;
      setStatus("Loaded " + item.name + " from history.");
      setCompareMode("split");
      showCompare();
    }
    function renderHistory() {
      const items = loadHistory();
      historyListEl.innerHTML = "";
      if (!items.length) {
        historyListEl.innerHTML = "<li>No conversions yet.</li>";
        return;
      }
      items.forEach((item) => {
        const li = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = item.name + " - " + item.time;
        button.onclick = () => restoreHistory(item);
        li.appendChild(button);
        historyListEl.append(li);
      });
    }
    // Turns /api/analyze JSON into readable program / fields / paragraphs text.
    function formatAnalysis(data) {
      const fields = (data.attributes || [])
      .map((item) => "- " + item.name + " (" + item.pic + ")")
      .join("\n") || "- none";
      const paragraphs = (data.paragraphs || [])
      .map((item) => "- " + item.name)
      .join("\n") || "- none";
      return (
      "Program: " + (data.program_name || "UNKNOWN") + "\n\n" +
      "Fields:\n" + fields + "\n\n" +
      "Paragraphs:\n" + paragraphs
    );
    }
    function setStatus(message, isError) {
      statusEl.textContent = message;
      statusEl.classList.toggle("error", Boolean(isError));
    }
    const API_ORIGIN = location.port === "8000" ? "" : "http://127.0.0.1:8000";
    function showError(err) {
      setStatus(err.message, true);
      outEl.textContent = err.message;
    }
    function setTab(activeId) {
      document.getElementById("tab-out").classList.toggle("active", activeId === "tab-out");
      document.getElementById("tab-compare").classList.toggle("active", activeId === "tab-compare");
      document.getElementById("tab-console").classList.toggle("active", activeId === "tab-console");
      document.getElementById("tab-history").classList.toggle("active", activeId === "tab-history");
    }
    function setCompareMode(mode) {
      document.getElementById("view-split").classList.toggle("active", mode === "split");
      document.getElementById("view-cobol").classList.toggle("active", mode === "cobol");
      document.getElementById("view-python").classList.toggle("active", mode === "python");
      cobolPane.hidden = mode === "python";
      pythonPane.hidden = mode === "cobol";
      splitEl.classList.toggle("single", mode != "split");
    }
    function showResults() {
      outEl.hidden = false;
      compareEl.hidden = true;
      consoleEl.hidden = true;
      historyEl.hidden = true;
      titleEl.textContent = "Analysis";
      setTab("tab-out");
    }
    // Translation tab. Needs lastPython. Unhide #compare and #split or view stays blank.
    function showCompare() {
      if (!lastPython) {
        setStatus("Translate a file first.", true);
        return;
      }
      outEl.hidden = true;
      compareEl.hidden = false;
      splitEl.hidden = false;
      consoleEl.hidden = true;
      historyEl.hidden = true;
      titleEl.textContent = "Translation";
      setTab("tab-compare");
    }
    function showConsole() {
      outEl.hidden = true;
      compareEl.hidden = true;
      consoleEl.hidden = false;
      historyEl.hidden = true;
      consoleEl.textContent = lastConsole;
      titleEl.textContent = "Console Log";
      setTab("tab-console");
    }
    function showHistory() {
      outEl.hidden = true;
      compareEl.hidden = true;
      consoleEl.hidden = true;
      historyEl.hidden = false;
      titleEl.textContent = "History";
      setTab("tab-history");
      renderHistory();
    }
    async function api(url, options) {
      const response = await fetch(API_ORIGIN + url, { cache: "no-store", ...options });
      const text = await response.text();
      let data;
      try {
        data = JSON.parse(text);
      } catch (err) {
        const snippet = text.replace(/\s+/g, " ").trim().slice(0, 180);
        throw new Error(snippet
          ? "The server did not return JSON. " + snippet
          : "The server returned an empty response.");
      }
      if (!response.ok) {
        const detail = data && data.detail;
        throw new Error(typeof detail === "string" ? detail : JSON.stringify(data));
      }
      return data;
    }
    document.getElementById("tab-out").onclick = showResults;
    document.getElementById("tab-compare").onclick = showCompare;
    document.getElementById("tab-console").onclick = showConsole;
    document.getElementById("tab-history").onclick = showHistory;
    document.getElementById("clear-history").onclick = () => {
      localStorage.removeItem(HISTORY_KEY);
      const file = currentFile();
      // Clear list
      if (lastPython && lastCobol && file) {
        saveHistoryEntry(file.name, lastCobol, lastPython, lastConsole, lastAnalysis);
        setStatus("Older history cleared. This translation is still listed.")
      } else {
          renderHistory();
          setStatus("History cleared.");
        }
    };
    renderHistory();
    document.getElementById("view-split").onclick = () => setCompareMode("split");
    document.getElementById("view-cobol").onclick = () => setCompareMode("cobol"); 
    document.getElementById("view-python").onclick = () => setCompareMode("python"); 
    document.getElementById("sample").onclick = async () => {
      try {
        const sample = await api("/api/sample");
        const blob = new Blob([sample.source], { type: "text/plain" });
        const file = new File([blob], sample.name);
        const dt = new DataTransfer();
        dt.items.add(file);
        fileEl.files = dt.files;
        // Same filename + text in history: reopen. Else reset Analysis to Waiting...
        const saved = findHistory(sample.name, sample.source)
        if (saved) {
          restoreHistory(saved);
          return;
        }
        lastCobol = sample.source;
        clearTranslation();
        setStatus("Sample loaded. Click Start to begin conversion.");
        outEl.textContent = "Waiting...";
        showResults();
      } catch (err) {
        showError(err);
      }
    };
    fileEl.onchange = () => {
      const file = currentFile();
      if (!file) return;
      if (!isCobolFile(file)) {
        setStatus(COBOL_ERROR, true);
        return;
      }
      file.text().then((text) => {
        const saved = findHistory(file.name, text);
        if (saved) {
          restoreHistory(saved);
          return;
        }
        lastCobol = text;
        clearTranslation();
        outEl.textContent = "Waiting...";
        cobolEl.textContent = "Waiting...";
        pythonEl.textContent = "Waiting...";
        setStatus(file.name + " loaded. Click Start.");
        showResults();
      });
    }
    document.getElementById("convert").onclick = async () => {
      const file = currentFile();
      if (!file) { setStatus("Choose a file first.", true); return; }
      if (!isCobolFile(file)) { setStatus(COBOL_ERROR, true); return; }
      if (!lastCobol) lastCobol = await file.text();
      const key = fileKey(file, lastCobol);
      // Same filename + source as last successful convert: skip /api/convert and reopen row.
      const savedSameFile = findHistory(file.name, lastCobol);
      if (savedSameFile) {
        restoreHistory(savedSameFile);
        setStatus("This file is already translated.");
        return;
      }
      // Same COBOL under different name: reuse Python/analysis, save a new history row.
      const saveSameText = findHistoryByText(lastCobol);
      if (saveSameText) {
        lastPython = saveSameText.python;
        lastAnalysis = saveSameText.analysis || "";
        lastConsole = saveSameText.consoleLog || lastConsole;
        lastTranslatedKey = key;
        outEl.textContent = lastAnalysis || "Waiting...";
        cobolEl.textContent = lastCobol;
        pythonEl.textContent = lastPython;
        consoleEl.textContent = lastConsole;
        saveHistoryEntry(file.name, lastCobol, lastPython, lastConsole, lastAnalysis);
        setStatus("Same COBOL as " + saveSameText.name + ". Reused that translation.");
        setCompareMode("split");
        showCompare();
        return;
      }
      // Same file already converted in this tab (history is cleared): skip API, then re-save if missing.
      if (lastPython && lastTranslatedKey === key) {
        if (!findHistory(file.name, lastCobol)) {
          saveHistoryEntry(file.name, lastCobol, lastPython, lastConsole, lastAnalysis);
        }
        setStatus("This file is already converted. View Translation");
        showCompare();
        return;
      }
      const body = new FormData();
      body.append("file", file);
      try {
        setStatus("Converting...");
        const data = await api("/api/convert", { method: "POST", body });
        lastPython = data.python || "";
        lastTranslatedKey = key;
        const analysisBody = new FormData();
        analysisBody.append("file", file);
        const analysis = await api("/api/analyze", { method: "POST", body: analysisBody });
        outEl.textContent = formatAnalysis(analysis);
        lastConsole = data.console_log || JSON.stringify(data, null, 2);
        lastAnalysis = outEl.textContent;
        saveHistoryEntry(file.name, lastCobol, lastPython, lastConsole, lastAnalysis);
        cobolEl.textContent = lastCobol || "(no COBOL loaded)";
        pythonEl.textContent = lastPython || JSON.stringify(data, null, 2);
        consoleEl.textContent = lastConsole;
        setStatus("Translation done. Click Translation or Analysis to view output.");
        setCompareMode("split");
        showCompare();
      } catch (err) {
        showError(err);
      }
    };
    document.getElementById("download").onclick = () => {
      if (!lastPython) {
        setStatus("Convert a file first.", true);
        return;
    }
    const name = ((currentFile() && currentFile().name) || "converted.cbl")
    .replace(/\.(cbl|cob)$/i, "") + ".py";
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([lastPython], { type: "text/plain" }));
    link.download = name;
    link.click();
    URL.revokeObjectURL(link.href);
    setStatus("Downloaded " + name + ".");
  };
  </script>
</body>
</html>
