services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: legacylift
      POSTGRES_PASSWORD: legacylift
      POSTGRES_DB: legacylift
    ports:
      - "5432:5432"
    volumes:
      - legacylift_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacylift -d legacylift"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  legacylift_pg: