# Start LegacyLift locally: docker compose up --build
# Web app http://localhost:8080 · API http://localhost:8000/docs
name: legacylift

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: legacylift
      POSTGRES_PASSWORD: legacylift
      POSTGRES_DB: legacylift
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/compose-init.sql:/docker-entrypoint-initdb.d/compose-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacylift -d legacylift"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://legacylift:legacylift@db:5432/legacylift
      LEGACYLIFT_ENABLE_RUNNER: "true"
      LEGACYLIFT_RUNNER_URL: http://runner:8001
      # No value: Compose passes it from the root .env or the shell, if it is set.
      LEGACYLIFT_GEMINI_API_KEY:
    ports:
      - "8000:8000"
    networks: [default, runner]
    depends_on:
      db:
        condition: service_healthy
      runner:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Compiles and runs uploaded COBOL and generated Python. Only the API can reach it.
  runner:
    build:
      context: .
      dockerfile: backend/runner.Dockerfile
    networks: [runner]
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 64
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: frontend/app
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

networks:
  # No internet: the runner talks only to the API.
  runner:
    internal: true

volumes:
  db-data:
