<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Georgia, 'Times New Roman', serif" font-size="14" role="img" aria-labelledby="title desc">
  <title id="title">LegacyLift architecture</title>
  <desc id="desc">The browser loads the web app, which calls the API. The API stores projects in PostgreSQL and sends COBOL and generated Python to the runner, which sits on an internal network with no internet access.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#fff"/>
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <rect x="20" y="40" width="130" height="64"/>
    <rect x="200" y="40" width="160" height="64"/>
    <rect x="410" y="40" width="160" height="64"/>
    <rect x="610" y="40" width="130" height="64"/>
    <rect x="380" y="160" width="220" height="140" stroke-dasharray="6 4"/>
    <rect x="410" y="200" width="160" height="80"/>
  </g>
  <g text-anchor="middle">
    <text x="85" y="77" font-weight="bold">Browser</text>
    <text x="280" y="68" font-weight="bold">Web app</text>
    <text x="280" y="88">React, served by nginx</text>
    <text x="490" y="68" font-weight="bold">API</text>
    <text x="490" y="88">FastAPI</text>
    <text x="675" y="68" font-weight="bold">PostgreSQL</text>
    <text x="675" y="88">projects, runs</text>
    <text x="490" y="182" font-size="12">internal network: no internet</text>
    <text x="490" y="226" font-weight="bold">Runner</text>
    <text x="490" y="246">GnuCOBOL + Python</text>
    <text x="490" y="266" font-size="12">non-root, read-only, limits</text>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="150" y1="72" x2="198" y2="72"/>
    <line x1="360" y1="72" x2="408" y2="72"/>
    <line x1="570" y1="72" x2="608" y2="72"/>
    <line x1="490" y1="104" x2="490" y2="198"/>
  </g>
  <g font-size="12">
    <text x="384" y="62" text-anchor="middle">/api</text>
    <text x="589" y="62" text-anchor="middle">SQL</text>
    <text x="498" y="130">POST /run/cobol</text>
    <text x="498" y="146">POST /run/python</text>
  </g>
</svg>
