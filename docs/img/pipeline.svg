<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 130" font-family="Georgia, 'Times New Roman', serif" font-size="14" role="img" aria-labelledby="title desc">
  <title id="title">LegacyLift pipeline</title>
  <desc id="desc">Four steps: upload COBOL programs, copybooks, and data files; analyze COPY, CALL, and PERFORM links; convert to Python with review notes; verify by running COBOL and Python and comparing their output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="760" height="130" fill="#fff"/>
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <rect x="10" y="25" width="160" height="80"/>
    <rect x="203" y="25" width="160" height="80"/>
    <rect x="396" y="25" width="160" height="80"/>
    <rect x="589" y="25" width="160" height="80"/>
  </g>
  <g text-anchor="middle">
    <text x="90" y="55" font-weight="bold">1. Upload</text>
    <text x="90" y="77" font-size="12">.cbl  .cpy  .dat</text>
    <text x="283" y="55" font-weight="bold">2. Analyze</text>
    <text x="283" y="77" font-size="12">COPY, CALL, PERFORM</text>
    <text x="283" y="93" font-size="12">links</text>
    <text x="476" y="55" font-weight="bold">3. Convert</text>
    <text x="476" y="77" font-size="12">Python draft</text>
    <text x="476" y="93" font-size="12">+ review notes</text>
    <text x="669" y="55" font-weight="bold">4. Verify</text>
    <text x="669" y="77" font-size="12">COBOL vs Python output,</text>
    <text x="669" y="93" font-size="12">line diff</text>
  </g>
  <g stroke="#000" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="170" y1="65" x2="201" y2="65"/>
    <line x1="363" y1="65" x2="394" y2="65"/>
    <line x1="556" y1="65" x2="587" y2="65"/>
  </g>
</svg>
